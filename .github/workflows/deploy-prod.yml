name: Deploy prod (Cloudflare Pages)

# Every push to main is built with the production settings and published to
# https://admin.trilo.win. Needs one repository secret: CLOUDFLARE_API_TOKEN
# (a Cloudflare token with only "Account > Cloudflare Pages > Edit").
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy that hasn't finished yet.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Production settings. None of these are secret: they end up in the
      # public JavaScript bundle anyway.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.trilo.win

      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name triloplan-admin --branch main --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ba86d0aba7654162e6832b5d32d804bb
